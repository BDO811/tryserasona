<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serasona</title>
<link rel="canonical" href="https://www.serasona.com/">
<meta name="robots" content="noindex">
<!-- Server-side 301 is not available on GitHub Pages, so the redirect is done
     three ways: a canonical link for crawlers, a meta refresh for clients with
     no JS, and a script that preserves the path and query the visitor arrived
     with. Without that last part, a bookmarked /pricing would land on the home
     page instead. -->
<meta http-equiv="refresh" content="0; url=https://www.serasona.com/">
<script>
  (function () {
    var target = "https://www.serasona.com" + location.pathname + location.search + location.hash;
    location.replace(target);
  })();
</script>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#fbf7f1; color:#1b1510;
         display:flex; min-height:100vh; margin:0; align-items:center; justify-content:center; }
  a { color:#c2410c; }
</style>
</head>
<body>
  <p>Serasona has moved to <a href="https://www.serasona.com/">www.serasona.com</a>.</p>
</body>
</html>
